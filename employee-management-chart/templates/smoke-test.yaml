apiVersion: batch/v1
kind: Job

metadata:
  name: {{ include "employee-management-chart.fullname" . }}-smoke-test

  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: smoke-test
          image: curlimages/curl:latest

          command:
            - sh
            - -c
            - |
              echo "Running smoke test..."

              curl --fail \
                http://{{ include "employee-management-chart.fullname" . }}:{{ .Values.service.port }}/health

              echo "Smoke test passed."
