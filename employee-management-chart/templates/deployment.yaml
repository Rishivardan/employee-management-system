{{- if not .Values.rollout.enabled }}

# your existing Deployment YAML here

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "employee-management-chart.fullname" . }}

  labels:
    {{- include "employee-management-chart.labels" . | nindent 4 }}

annotations:
  argocd.argoproj.io/sync-wave: "0"
  
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "employee-management-chart.selectorLabels" . | nindent 6 }}

  template:

    metadata:
      labels:
        {{- include "employee-management-chart.selectorLabels" . | nindent 8 }}

      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:

      serviceAccountName: default

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:

        - name: {{ include "employee-management-chart.name" . }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:

            - name: http
              containerPort: {{ .Values.service.targetPort }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          env:

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "employee-management-chart.fullname" . }}-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "employee-management-chart.fullname" . }}-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "employee-management-chart.fullname" . }}-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "employee-management-chart.fullname" . }}-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "employee-management-chart.fullname" . }}-secret
                  key: DB_PASSWORD

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}