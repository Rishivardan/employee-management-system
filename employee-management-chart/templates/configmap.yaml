apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "employee-management-chart.fullname" . }}-config
  labels:
{{ include "employee-management-chart.labels" . | indent 4 }}
data:
  DB_HOST: {{ .Values.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  DB_USER: {{ .Values.config.DB_USER | quote }}
